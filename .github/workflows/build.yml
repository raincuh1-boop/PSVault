name: PSVault Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl git cmake libicu-dev clang lld python3
      - name: Install libssl1.1 for PkgTool.Core
        run: |
          base="http://security.ubuntu.com/ubuntu/pool/main/o/openssl/"
          ver="$(curl -fsSL "$base" | grep -oE 'libssl1\.1_1\.1\.1f-[0-9a-z.~+]+_amd64\.deb' | sed -E 's/^libssl1\.1_(.*)_amd64\.deb$/\1/' | sort -V | tail -1)"
          test -n "$ver"
          curl -fsSL -o libssl1.1.deb "\${base}libssl1.1_\${ver}_amd64.deb"
          sudo dpkg -i libssl1.1.deb || sudo apt-get install -f -y
      - name: Install OpenOrbis toolchain
        run: |
          curl -fsSL https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz -o oo.tar.gz
          mkdir -p "$HOME/oo"
          tar -xzf oo.tar.gz -C "$HOME/oo"
          OO_ROOT="$(dirname "$(find "$HOME/oo" -name link.x -print -quit)")"
          test -f "$OO_ROOT/link.x"
          echo "OO_PS4_TOOLCHAIN=$OO_ROOT" >> "$GITHUB_ENV"
      - name: Build PS4 SDL2 library
        run: |
          git clone --depth 1 --branch ps4 https://github.com/bucanero/SDL-PS4.git "$HOME/SDL-PS4"
          mkdir -p "$HOME/SDL-PS4/orbis"
          cd "$HOME/SDL-PS4/orbis"
          cmake --toolchain ../cmake/openorbis.cmake ..
          make -j2
          cp libSDL2.a "$OO_PS4_TOOLCHAIN/lib/libSDL2.a"
          mkdir -p "$OO_PS4_TOOLCHAIN/include/SDL2"
          cp -R "$HOME/SDL-PS4/include/." "$OO_PS4_TOOLCHAIN/include/SDL2/"
      - name: Stage required system modules
        run: |
          mkdir -p sce_sys/about sce_module
          RS="$(find "$OO_PS4_TOOLCHAIN" -name right.sprx -print -quit)"
          test -n "$RS"
          cp "$RS" sce_sys/about/right.sprx
          for module in libc.prx libSceFios2.prx; do
            found="$(find "$OO_PS4_TOOLCHAIN" -name "$module" -print -quit)"
            if [ -n "$found" ]; then cp "$found" "sce_module/$module"; fi
          done
      - name: Build PSVault
        run: |
          CLANG="$(find "$OO_PS4_TOOLCHAIN" -type f -name clang -print -quit)"
          LLD="$(find "$OO_PS4_TOOLCHAIN" -type f -name ld.lld -print -quit)"
          make CC="\${CLANG:-clang}" LD="\${LLD:-ld.lld}"
      - name: Upload PSVault package
        uses: actions/upload-artifact@v4
        with:
          name: PSVault-PKG
          path: |
            *.pkg
            eboot.bin
          if-no-files-found: error
          retention-days: 30
